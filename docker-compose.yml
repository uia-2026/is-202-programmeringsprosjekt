services:
  app:
    build:
      context: .
      dockerfile: Heimevernet/Dockerfile
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__heimevernetdb: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}
      Storage__Endpoint: ${STORAGE_ENDPOINT}
      Storage__Region: ${STORAGE_REGION}
      Storage__AccessKeyId: ${STORAGE_ACCESS_KEY_ID}
      Storage__SecretAccessKey: ${STORAGE_SECRET_ACCESS_KEY}
      Storage__Bucket: ${STORAGE_BUCKET}
      Storage__PublicBaseUrl: ${STORAGE_PUBLIC_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: Heimevernet.Migrator/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__heimevernetdb: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mariadb_data:
