name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 158.158.122.123
          username: danylo-bodnar
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd ~/heimevernet
            git pull origin main
            docker compose up -d --build
